name: Build and Test Container

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./docker/Dockerfile
          build-args: BUILD_ENV=local
          push: false
          load: true
          tags: thunderbird-web:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start container
        run: |
          docker run -d --name tb-web-test thunderbird-web:test
          for i in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' tb-web-test 2>/dev/null)
            [ "$status" = "healthy" ] && break
            [ "$status" = "unhealthy" ] && docker logs tb-web-test && exit 1
            sleep 1
          done

      - name: Run all tests
        run: |
          docker exec tb-web-test sh -c "cd /build && uv run pytest tests/ -v"

      - name: Show container logs on failure
        if: failure()
        run: docker logs tb-web-test

      - name: Cleanup
        if: always()
        run: docker rm -f tb-web-test || true
