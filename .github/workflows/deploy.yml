name: Build and Deploy
run-name: >-
  Deploy
  ${{ github.event.inputs.environment || github.event.action || (github.ref_name == 'prod' && 'prod') || 'stage' }}
  -
  ${{ github.event.client_payload.message || (github.event_name == 'push' && format('thunderbird-website {0} push', github.ref_name)) || 'manual deployment' }}

on:
  push:
    branches: [master, prod]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        type: choice
        options:
          - stage
          - prod
  repository_dispatch:
    types: [stage, prod]

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-${{ github.event.inputs.environment || github.event.action || (github.ref_name == 'prod' && 'prod') || 'stage' }}
  cancel-in-progress: ${{ (github.event.inputs.environment || github.event.action || (github.ref_name == 'prod' && 'prod') || 'stage') != 'prod' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || github.event.action || (github.ref_name == 'prod' && 'prod') || 'stage' }}
    env:
      DEPLOY_ENV: ${{ github.event.inputs.environment || github.event.action || (github.ref_name == 'prod' && 'prod') || 'stage' }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup AWS + Pulumi
        uses: ./.github/actions/pulumi-setup
        with:
          aws-role-arn: arn:aws:iam::768512802988:role/thunderbird-website-deploy
          pulumi-dir: ./pulumi

      - name: Login to private ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2

      - name: Login to public ECR
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2
        env:
          AWS_REGION: us-east-1 # Public ECR authentication is only available here.
        with:
          registry-type: public

      - name: Build and push Docker image
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: python3 deployment_image.py

      - name: Publish to tb-website-builds
        env:
          IMAGE_URI: ${{ steps.build-image.outputs.image_uri }}
          TB_BUILDS_BRANCH: ${{ env.DEPLOY_ENV == 'prod' && 'prod' || 'master' }}
          BUILD_MESSAGE: ${{ github.event.client_payload.message || (github.event_name == 'push' && format('thunderbird-website {0} push.', github.ref_name)) || 'manual deployment.' }}
          TB_BUILDS_KEY: ${{ secrets.TB_BUILDS_KEY }}
          TB_BUILDS_GIT_EMAIL: ${{ secrets.TB_BUILDS_GIT_EMAIL }}
          CACHE_PURGE_CONFIG: ${{ vars.CACHE_PURGE_CONFIG }}
          CACHE_PURGE_ZONE_CREDENTIALS: ${{ secrets.CACHE_PURGE_ZONE_CREDENTIALS }}
        run: |
          set -euo pipefail
          builds="${RUNNER_TEMP}/tb-website-builds"
          git clone --depth 1 --branch "$TB_BUILDS_BRANCH" \
            https://github.com/thunderbird/tb-website-builds.git \
            "$builds"
          if [ "$DEPLOY_ENV" = "prod" ]; then
            config="${RUNNER_TEMP}/cache-purge-config.json"
            receipt="${RUNNER_TEMP}/purge-receipt.json"
            printf '%s' "$CACHE_PURGE_CONFIG" > "$config"
            python3 deployment_cli.py publish \
              --image "$IMAGE_URI" \
              --environment prod \
              --checkout "$builds" \
              --remote https://github.com/thunderbird/tb-website-builds.git \
              --message "$BUILD_MESSAGE" \
              --configuration "$config" \
              --identity "${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}" \
              --state-ref refs/heads/purge-state \
              --state-path prod.json \
              --receipt "$receipt"
          else
            python3 deployment_cli.py publish \
              --image "$IMAGE_URI" \
              --environment stage \
              --checkout "$builds" \
              --remote https://github.com/thunderbird/tb-website-builds.git \
              --message "$BUILD_MESSAGE"
          fi

      - name: Deploy infrastructure
        uses: pulumi/actions@96c7761824268174e0d2a4e8c7d75671eebd24a7 # v7.1.0
        with:
          command: up
          stack-name: thunderbird/thunderbird-website/${{ env.DEPLOY_ENV }}
          work-dir: ./pulumi
          refresh: true
        env:
          IMAGE_URI: ${{ steps.build-image.outputs.image_uri }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update ECS service
        id: update-ecs
        env:
          BUILD_ENV: ${{ env.DEPLOY_ENV }}
          AWS_PAGER: ""
          AWS_CLI_AUTO_PROMPT: "off"
        run: python3 deployment_ecs.py

      - name: Purge production caches
        if: ${{ env.DEPLOY_ENV == 'prod' }}
        env:
          IMAGE_URI: ${{ steps.build-image.outputs.image_uri }}
          DEPLOYMENT_ID: ${{ steps.update-ecs.outputs.deployment_id }}
          TB_BUILDS_KEY: ${{ secrets.TB_BUILDS_KEY }}
          TB_BUILDS_GIT_EMAIL: ${{ secrets.TB_BUILDS_GIT_EMAIL }}
          CACHE_PURGE_ZONE_CREDENTIALS: ${{ secrets.CACHE_PURGE_ZONE_CREDENTIALS }}
        run: |
          set -euo pipefail
          if [ "$DEPLOY_ENV" != "prod" ]; then
            exit 0
          fi
          python3 deployment_cli.py purge \
            --configuration "${RUNNER_TEMP}/cache-purge-config.json" \
            --receipt "${RUNNER_TEMP}/purge-receipt.json" \
            --identity "${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}" \
            --image "$IMAGE_URI" \
            --workspace "${RUNNER_TEMP}/tb-website-builds" \
            --remote https://github.com/thunderbird/tb-website-builds.git \
            --state-ref refs/heads/purge-state \
            --state-path prod.json \
            --cluster "thunderbird-website-${DEPLOY_ENV}" \
            --service "thunderbird-website-${DEPLOY_ENV}" \
            --region "$AWS_REGION" \
            --deployment-id "$DEPLOYMENT_ID"
