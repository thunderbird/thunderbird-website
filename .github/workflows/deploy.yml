name: Build and Deploy
run-name: >-
  Deploy
  ${{ github.event.inputs.environment || github.event.action || (github.ref_name == 'prod' && 'prod') || 'stage' }}
  -
  ${{ github.event.client_payload.message || (github.event_name == 'push' && format('thunderbird-website {0} push', github.ref_name)) || 'manual deployment' }}

on:
  push:
    branches: [master, prod]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        type: choice
        options:
          - stage
          - prod
  repository_dispatch:
    types: [stage, prod]

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-${{ github.event.inputs.environment || github.event.action || (github.ref_name == 'prod' && 'prod') || 'stage' }}
  cancel-in-progress: ${{ (github.event.inputs.environment || github.event.action || (github.ref_name == 'prod' && 'prod') || 'stage') != 'prod' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || github.event.action || (github.ref_name == 'prod' && 'prod') || 'stage' }}
    env:
      DEPLOY_ENV: ${{ github.event.inputs.environment || github.event.action || (github.ref_name == 'prod' && 'prod') || 'stage' }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup AWS + Pulumi
        uses: ./.github/actions/pulumi-setup
        with:
          aws-role-arn: arn:aws:iam::768512802988:role/thunderbird-website-deploy
          pulumi-dir: ./pulumi

      - name: Login to private ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2

      - name: Login to public ECR
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2
        env:
          AWS_REGION: us-east-1 # Public ECR authentication is only available here.
        with:
          registry-type: public

      - name: Build and push Docker image
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
          BUILD_ENV: ${{ env.DEPLOY_ENV }}
        run: |
          IMAGE_URI="$ECR_REGISTRY/thunderbird-website-$BUILD_ENV:$IMAGE_TAG"
          if [ "$BUILD_ENV" = "prod" ]; then REPO_BRANCH="prod"; else REPO_BRANCH="master"; fi
          docker build \
            -f docker/Dockerfile \
            --build-arg BUILD_ENV=$BUILD_ENV \
            --build-arg REPO_BRANCH=$REPO_BRANCH \
            -t $IMAGE_URI \
            -t $ECR_REGISTRY/thunderbird-website-$BUILD_ENV:latest \
            .
          docker push $IMAGE_URI
          docker push $ECR_REGISTRY/thunderbird-website-$BUILD_ENV:latest
          echo "image_uri=$IMAGE_URI" >> $GITHUB_OUTPUT

      - name: Publish to tb-website-builds
        env:
          IMAGE_URI: ${{ steps.build-image.outputs.image_uri }}
          TB_BUILDS_BRANCH: ${{ env.DEPLOY_ENV == 'prod' && 'prod' || 'master' }}
          BUILD_MESSAGE: ${{ github.event.client_payload.message || (github.event_name == 'push' && format('thunderbird-website {0} push.', github.ref_name)) || 'manual deployment.' }}
        run: |
          docker create --name extract $IMAGE_URI
          git clone --depth 1 --branch $TB_BUILDS_BRANCH \
            https://github.com/thunderbird/tb-website-builds.git \
            tb-website-builds
          cd tb-website-builds
          git remote set-url origin \
            https://x-access-token:${{ secrets.TB_BUILDS_KEY }}@github.com/thunderbird/tb-website-builds.git
          find . -maxdepth 1 ! -name '.git' ! -name 'README.md' ! -name '.' -exec rm -rf {} +
          docker cp extract:/var/www/html/start/. .
          git add -A
          git diff --cached --quiet || \
            git -c user.name="Thundernest Bot" -c user.email="${{ secrets.TB_BUILDS_GIT_EMAIL }}" \
              commit -m "Website rebuild triggered by $BUILD_MESSAGE"
          git push

      - name: Deploy infrastructure
        uses: pulumi/actions@96c7761824268174e0d2a4e8c7d75671eebd24a7 # v7.1.0
        with:
          command: up
          stack-name: thunderbird/thunderbird-website/${{ env.DEPLOY_ENV }}
          work-dir: ./pulumi
          refresh: true
        env:
          IMAGE_URI: ${{ steps.build-image.outputs.image_uri }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update ECS service
        env:
          BUILD_ENV: ${{ env.DEPLOY_ENV }}
        run: |
          aws ecs update-service \
            --cluster thunderbird-website-$BUILD_ENV \
            --service thunderbird-website-$BUILD_ENV \
            --force-new-deployment \
            --region $AWS_REGION

      - name: Wait for production ECS service stability
        if: env.DEPLOY_ENV == 'prod'
        run: |
          aws ecs wait services-stable \
            --cluster thunderbird-website-$DEPLOY_ENV \
            --services thunderbird-website-$DEPLOY_ENV \
            --region $AWS_REGION

      - name: Purge production Cloudflare cache
        if: env.DEPLOY_ENV == 'prod'
        env:
          CACHE_PURGE_CONFIG: ${{ vars.CACHE_PURGE_CONFIG }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          die() { printf '%s\n' "$1" >&2; exit 1; }
          config=${CACHE_PURGE_CONFIG-}
          token=${CLOUDFLARE_API_TOKEN-}
          config_present=${config//[[:space:]]/}
          token_present=${token//[[:space:]]/}
          [ -n "$config_present" ] || die "Cloudflare purge configuration is missing"
          [ -n "$token_present" ] || die "Cloudflare API token is missing"
          case "$token" in
            *[[:space:]]*) die "Cloudflare API token is missing" ;;
          esac
          unset config_present token_present
          # jq can print the rejected document, so keep its diagnostics off the log.
          plans=$(printf '%s' "$config" | jq -ce '
            def plan:
              if type != "object" then error("zone")
              elif (.id | type) != "string" or ((.id | test("^[0-9a-fA-F]{32}$")) | not) then error("id")
              elif (has("hosts") and has("purge_everything")) then error("ambiguous")
              elif has("hosts") then
                if (.hosts | type) != "array" or (.hosts | length) == 0
                   or any(.hosts[]; type != "string" or length == 0) then error("hosts")
                else {id, payload: {hosts}} end
              elif .purge_everything == true then {id, payload: {purge_everything: true}}
              else error("scope") end;
            if type != "object" or (.zones | type) != "array" or (.zones | length) == 0 then error("config")
            else .zones[] | plan end
          ' 2>/dev/null) || die "Cloudflare purge configuration is invalid"
          [ -n "$plans" ] || die "Cloudflare purge configuration is invalid"
          body=
          trap '[ -n "${body:-}" ] && rm -f "$body"' EXIT
          while IFS= read -r plan; do
            zone_id=$(printf '%s' "$plan" | jq -er '.id') || die "Cloudflare purge configuration is invalid"
            payload=$(printf '%s' "$plan" | jq -ce '.payload') || die "Cloudflare purge configuration is invalid"
            body=$(mktemp)
            # -q blocks a curlrc from following redirects or tracing the token.
            if ! code=$(curl -q --silent --show-error \
                --connect-timeout 10 --max-time 30 \
                --output "$body" --write-out '%{http_code}' \
                --request POST \
                --header "Authorization: Bearer ${token}" \
                --header 'Content-Type: application/json' \
                --data "$payload" \
                "https://api.cloudflare.com/client/v4/zones/${zone_id}/purge_cache"); then
              die "Cloudflare purge request failed for zone ${zone_id}"
            fi
            # Accept only a single JSON object. jq's exit status is the decision.
            if [ "$code" != "200" ] || ! jq -e -s 'length == 1 and (.[0] | type) == "object" and .[0].success == true' "$body" >/dev/null; then
              die "Cloudflare purge for zone ${zone_id} was not accepted (HTTP ${code})"
            fi
            rm -f "$body"
            body=
          done <<< "$plans"
