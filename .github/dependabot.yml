version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /tools/form-bridge
    schedule:
      interval: weekly
    ignore:
      # Refresh the digest without changing the Python runtime series.
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
